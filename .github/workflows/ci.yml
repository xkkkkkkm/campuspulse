name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TEST_MYSQL_IMAGE: mysql:8.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - run: node --test tools/tests/proxy.test.cjs
      - run: python -m unittest discover -s tools/tests -v
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml/tests -v
      - name: Verify the LangGraph service without external credentials
        run: |
          python -m venv support-agent/.venv
          support-agent/.venv/bin/python -m pip install -r support-agent/requirements-dev.txt
          cd support-agent
          .venv/bin/python -m pytest -q
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run e2e
      - name: Start a clean full stack
        run: python tools/dev.py up
      - name: Verify live APIs and browser flows
        run: |
          python tools/smoke_test.py --base-url http://127.0.0.1:8125
          python tools/media_smoke_test.py --base-url http://127.0.0.1:8125
          python tools/support_smoke_test.py --base-url http://127.0.0.1:8125
          E2E_BASE_URL=http://127.0.0.1:8125 npm --prefix frontend run e2e:live
          python tools/dev.py run python ml/train_recommendation.py --dry-run
          CAMPUS_TEST_DATABASE=1 python tools/dev.py run python ml/tests/integration_publication.py
      - name: Verify database and private-image recovery
        run: CAMPUS_TEST_DATABASE=1 python tools/integration_backup.py --backup-path runtime/ci-backup
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > compose-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
            frontend/playwright-report
            runtime/ci-backup/verification.json
            compose-test.log
      - name: Stop test stack
        if: always()
        run: |
          docker compose -p campuspulse-restore-ci down -v
          docker compose down -v
