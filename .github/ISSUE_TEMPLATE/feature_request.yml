name: Feature request / 功能建议
description: Describe a user problem and a focused improvement / 描述用户问题和改进建议
title: "[Feature / 建议] "
body:
  - type: markdown
    attributes:
      value: |
        English or 简体中文 are welcome. Search existing issues and the README for related work or existing features.
        可使用英文或简体中文填写；请先搜索已有 Issue 和 README 中的现有功能。

        Do not include `.env` files, API keys, passwords, tokens or personal user data in examples or screenshots.
        样本和截图中请勿包含 `.env` 文件、API Key、密码、令牌或用户个人信息。
  - type: textarea
    id: problem
    attributes:
      label: User problem / 用户问题
      description: Who encounters the problem, in which workflow, and what is difficult today? / 哪类用户在哪个流程遇到什么困难？
      placeholder: As a student / organizer / administrator, when I… / 作为学生、组织者或管理员，当我……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement / 改进方案
      description: Describe the desired behavior or an example of success; alternatives are welcome. / 描述期望行为或完成后的例子，也可提供替代方案。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / 修改范围
      description: Which pages, roles or modules are involved? Describe the smallest useful version and any limits, or say if you are unsure. / 涉及哪些页面、角色或模块？说明最小可用范围和限制，不确定也可注明。
    validations:
      required: true
