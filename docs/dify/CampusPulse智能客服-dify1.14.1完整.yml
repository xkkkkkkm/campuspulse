app:
  description: CampusPulse 平台智能客服，支持知识库、多轮记忆、知识不匹配兜底和转人工说明。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: CampusPulse 智能客服
  use_icon_as_answer_icon: true
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.15@725407927b04e236212083d20e92830d60fa944e42cd357ef6902c160414f6f1
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我是 CampusPulse 智能客服。你可以咨询注册登录、邮箱验证码、活动报名、组队申请、消息通知、个人中心和后台管理相关问题。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 怎么报名活动？
    - 收不到邮箱验证码怎么办？
    - 队伍满员后还能管理吗？
    - 通知中心怎么只看未读？
    - 我要转人工服务
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: if-else
      id: start-human-check
      source: '1779118466186'
      sourceHandle: source
      target: human-check
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: answer
      id: human-check-human-answer
      source: human-check
      sourceHandle: 'true'
      target: human-answer
      targetHandle: target
      type: custom
    - data:
        sourceType: if-else
        targetType: knowledge-retrieval
      id: human-check-knowledge
      source: human-check
      sourceHandle: 'false'
      target: knowledge-retrieval
      targetHandle: target
      type: custom
    - data:
        sourceType: knowledge-retrieval
        targetType: llm
      id: knowledge-support-llm
      source: knowledge-retrieval
      sourceHandle: source
      target: support-llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: answer
      id: support-llm-final-answer
      source: support-llm
      sourceHandle: source
      target: final-answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        title: 用户输入
        type: start
        variables: []
      height: 73
      id: '1779118466186'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: c-human-1
            value: 人工
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-2
            value: 真人
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-3
            value: 管理员
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-4
            value: 转人工
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-5
            value: 我的报名
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-6
            value: 我的申请
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-7
            value: 审批结果
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-8
            value: 查账号
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-9
            value: 账号被锁
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-10
            value: 数据库
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-11
            value: API Key
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: c-human-12
            value: 密钥
            varType: string
            variable_selector:
            - sys
            - query
          id: 'true'
          logical_operator: or
        desc: 用户主动请求人工，或涉及具体账号、隐私、审批结果、密钥、数据库等敏感问题时，不让模型猜测，直接提示转人工。
        selected: false
        title: 人工与敏感问题判断
        type: if-else
      height: 220
      id: human-check
      position:
        x: 380
        y: 220
      positionAbsolute:
        x: 380
        y: 220
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        answer: 这个问题需要人工处理。请点击项目客服页面里的“转人工服务”按钮，系统会把你的问题发送给管理员；你也可以继续补充账号、活动名、队伍名和问题截图等背景信息，方便管理员定位。
        title: 转人工说明
        type: answer
        variables: []
      height: 139
      id: human-answer
      position:
        x: 730
        y: 112
      positionAbsolute:
        x: 730
        y: 112
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        dataset_ids: []
        desc: 导入后在这里绑定你已经创建的 CampusPulse 使用帮助知识库。
        multiple_retrieval_config:
          reranking_enable: false
          top_k: 6
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: 知识库检索
        type: knowledge-retrieval
      height: 132
      id: knowledge-retrieval
      position:
        x: 730
        y: 360
      positionAbsolute:
        x: 730
        y: 360
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    - data:
        context:
          enabled: true
          variable_selector:
          - knowledge-retrieval
          - result
        memory:
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            assistant: 智能客服
            user: 用户
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: |-
            你是 CampusPulse 校园活动与组队平台的智能客服。

            你的职责：
            1. 回答平台注册登录、邮箱验证码、活动报名、活动发布、活动管理、组队申请、队伍管理、私聊、活动群聊、队伍群聊、通知中心、个人中心、后台管理、推荐和搜索相关问题。
            2. 必须优先依据知识库检索结果回答。
            3. 如果知识库检索结果为空，或检索结果与用户问题不匹配，必须回复转人工说明，不允许编造。
            4. 如果问题涉及具体账号状态、具体报名/申请审批结果、隐私数据、数据库、密钥、支付、接口调用权限，必须回复转人工说明，不允许猜测。
            5. 如果用户明确要求人工、真人、老师、管理员协助，必须回复转人工说明。

            回答格式：
            - 能回答时：用简洁的步骤说明，必要时分 1、2、3 点。
            - 需要转人工时：回复“这个问题需要人工处理。请点击项目客服页面里的‘转人工服务’按钮，并补充账号、活动名、队伍名或截图。”
            - 不要输出 JSON。
            - 不要输出 ANSWER、ESCALATE。
            - 不要输出任何 {{#变量#}} 模板语法。
        - role: user
          text: |-
            用户问题：
            {{#sys.query#}}

            知识库检索结果：
            {{#context#}}

            请判断知识库是否足够支撑回答。如果足够，直接给用户可执行的答案；如果不够，输出转人工说明。
        selected: false
        title: 知识库质检回答
        type: llm
        vision:
          enabled: false
      height: 190
      id: support-llm
      position:
        x: 1080
        y: 330
      positionAbsolute:
        x: 1080
        y: 330
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 360
    - data:
        answer: '{{#support-llm.text#}}'
        title: 直接回复
        type: answer
        variables: []
      height: 103
      id: final-answer
      position:
        x: 1510
        y: 360
      positionAbsolute:
        x: 1510
        y: 360
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 300
    viewport:
      x: 0
      y: 0
      zoom: 0.75
  rag_pipeline_variables: []
