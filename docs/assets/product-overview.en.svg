<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1032" viewBox="0 0 1200 1032" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">CampusPulse product overview</title>
  <desc id="description">Campus activities and teamwork: discover and register for activities, create and join teams, exchange messages, and get support. Students, organizers and administrators use one bilingual platform. Model-generated support is optional and requires a provider API key.</desc>
  <!-- Editable vector artwork. Uses the existing CampusPulse pulse mark. -->
  <defs>
    <symbol id="compass" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12"/>
      <path d="m21 11-3 7-7 3 3-7 7-3Z"/>
    </symbol>
    <symbol id="people" viewBox="0 0 32 32">
      <circle cx="13" cy="10" r="4"/>
      <path d="M4 27v-3a9 9 0 0 1 18 0v3M22 6a4 4 0 0 1 0 8M25 19a7 7 0 0 1 3 6v2"/>
    </symbol>
    <symbol id="chat" viewBox="0 0 32 32">
      <path d="M5 5h22v17H14l-9 6V5Z"/>
      <path d="M10 11h12M10 16h8"/>
    </symbol>
    <symbol id="help" viewBox="0 0 32 32">
      <path d="M5 18v-3a11 11 0 0 1 22 0v8a6 6 0 0 1-6 6h-3"/>
      <rect x="3" y="15" width="6" height="9" rx="3"/>
      <rect x="23" y="15" width="6" height="9" rx="3"/>
    </symbol>

  </defs>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <rect x="1" y="1" width="1198" height="1030" rx="28" fill="#F5F8FC" stroke="#D8E2EE" stroke-width="2"/>
    <path d="M28 1h1144a27 27 0 0 1 27 27v244H1V28A27 27 0 0 1 28 1Z" fill="#102A48"/>
    <rect x="48" y="34" width="52" height="52" rx="14" fill="#0071E3"/>
    <path d="M56 61h9l5-11 8 21 5-10h9" fill="none" stroke="#FFF" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

<text x="114" y="70" font-size="32" font-weight="700" fill="#FFFFFF" >CampusPulse</text>
<text x="1152" y="66" font-size="18" font-weight="600" fill="#B8CDE4" text-anchor="end" letter-spacing="1.1">CAMPUS ACTIVITIES &amp; TEAMWORK</text>
<text x="48" y="151" font-size="52" font-weight="700" fill="#FFFFFF" >Discover. Join. Connect.</text>
<text x="48" y="193" font-size="23" font-weight="400" fill="#D3E2F3" >Find campus activities and the people to experience them with.</text>
<rect x="48" y="218" width="186" height="34" rx="17" fill="#244566"/>
<text x="141.0" y="241" font-size="18" font-weight="600" fill="#EFF7FF" text-anchor="middle">EN / 简体中文</text>
<rect x="246" y="218" width="282" height="34" rx="17" fill="#244566"/>
<text x="387.0" y="241" font-size="18" font-weight="600" fill="#EFF7FF" text-anchor="middle">Run locally with Docker</text>
<path d="M938 234h47l13-21 17 35 17-31 11 17h109" fill="none" stroke="#61CDB4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Discover activities -->
<g transform="translate(48 304)">
<rect width="540" height="236" rx="20" fill="#FFFFFF" stroke="#D9E3EF"/>
<rect x="24" y="24" width="48" height="48" rx="14" fill="#EAF3FF"/>
<use xlink:href="#compass" x="32" y="32" width="32" height="32" fill="none" stroke="#0868CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="57" font-size="30" font-weight="700" fill="#17314F" >Discover activities</text>
<text x="24" y="109" font-size="22" font-weight="400" fill="#42556B" >Browse, filter, save and register.</text>
<text x="24" y="141" font-size="22" font-weight="400" fill="#42556B" >Get recommendations based on rules.</text>
<rect x="24" y="171" width="130" height="38" rx="10" fill="#EAF3FF"/>
<text x="89.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Interests</text>
<rect x="164" y="171" width="116" height="38" rx="10" fill="#EAF3FF"/>
<text x="222.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Search</text>
<rect x="290" y="171" width="138" height="38" rx="10" fill="#EAF3FF"/>
<text x="359.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Favorites</text>
</g>

    <!-- Build your team -->
<g transform="translate(612 304)">
<rect width="540" height="236" rx="20" fill="#FFFFFF" stroke="#D9E3EF"/>
<rect x="24" y="24" width="48" height="48" rx="14" fill="#E8F7F0"/>
<use xlink:href="#people" x="32" y="32" width="32" height="32" fill="none" stroke="#167451" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="57" font-size="30" font-weight="700" fill="#17314F" >Build your team</text>
<text x="24" y="109" font-size="22" font-weight="400" fill="#42556B" >Create teams and review applications.</text>
<text x="24" y="141" font-size="22" font-weight="400" fill="#42556B" >Manage members and transfer leadership.</text>
<rect x="24" y="171" width="116" height="38" rx="10" fill="#E8F7F0"/>
<text x="82.0" y="196" font-size="19" font-weight="600" fill="#167451" text-anchor="middle">Create</text>
<rect x="150" y="171" width="104" height="38" rx="10" fill="#E8F7F0"/>
<text x="202.0" y="196" font-size="19" font-weight="600" fill="#167451" text-anchor="middle">Apply</text>
<rect x="264" y="171" width="124" height="38" rx="10" fill="#E8F7F0"/>
<text x="326.0" y="196" font-size="19" font-weight="600" fill="#167451" text-anchor="middle">Review</text>
</g>

    <!-- Stay connected -->
<g transform="translate(48 564)">
<rect width="540" height="236" rx="20" fill="#FFFFFF" stroke="#D9E3EF"/>
<rect x="24" y="24" width="48" height="48" rx="14" fill="#EAF3FF"/>
<use xlink:href="#chat" x="32" y="32" width="32" height="32" fill="none" stroke="#0868CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="57" font-size="30" font-weight="700" fill="#17314F" >Stay connected</text>
<text x="24" y="109" font-size="22" font-weight="400" fill="#42556B" >Send messages and private images.</text>
<text x="24" y="141" font-size="22" font-weight="400" fill="#42556B" >Keep chat history and receive notifications.</text>
<rect x="24" y="171" width="112" height="38" rx="10" fill="#EAF3FF"/>
<text x="80.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Direct</text>
<rect x="146" y="171" width="108" height="38" rx="10" fill="#EAF3FF"/>
<text x="200.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Team</text>
<rect x="264" y="171" width="124" height="38" rx="10" fill="#EAF3FF"/>
<text x="326.0" y="196" font-size="19" font-weight="600" fill="#0868CF" text-anchor="middle">Activity</text>
</g>

    <!-- Get support -->
<g transform="translate(612 564)">
<rect width="540" height="236" rx="20" fill="#FFFFFF" stroke="#D9E3EF"/>
<rect x="24" y="24" width="48" height="48" rx="14" fill="#FFF3DC"/>
<use xlink:href="#help" x="32" y="32" width="32" height="32" fill="none" stroke="#875816" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="57" font-size="30" font-weight="700" fill="#17314F" >Get support</text>
<text x="24" y="109" font-size="22" font-weight="400" fill="#42556B" >Read cited guides, revisit conversations</text>
<text x="24" y="141" font-size="22" font-weight="400" fill="#42556B" >or submit a ticket for administrator help.</text>
<rect x="24" y="171" width="444" height="38" rx="10" fill="#FFF3DC"/>
<text x="246.0" y="196" font-size="19" font-weight="600" fill="#875816" text-anchor="middle">Optional LLM · deployer’s API key</text>
</g>

    <!-- Typical roles; these are not an exhaustive permission matrix. -->
<rect x="48" y="832" width="1104" height="144" rx="20" fill="#E7EFF8"/>
<text x="72" y="865" font-size="16" font-weight="700" fill="#516882" letter-spacing="1.4">ONE PLATFORM, THREE ROLES</text>
<text x="72" y="906" font-size="24" font-weight="700" fill="#17314F" >Students</text>
<text x="72" y="940" font-size="21" font-weight="400" fill="#42556B" >Explore and take part</text>
<path d="M414 888v61" stroke="#C7D7E7"/>
<text x="438" y="906" font-size="24" font-weight="700" fill="#17314F" >Organizers</text>
<text x="438" y="940" font-size="21" font-weight="400" fill="#42556B" >Publish and review</text>
<path d="M780 888v61" stroke="#C7D7E7"/>
<text x="804" y="906" font-size="24" font-weight="700" fill="#17314F" >Administrators</text>
<text x="804" y="940" font-size="21" font-weight="400" fill="#42556B" >Moderate and support</text>
<text x="600" y="1009" font-size="18" font-weight="400" fill="#516882" text-anchor="middle">Activity registration and team membership use separate applications and approvals.</text>
  </g>
</svg>
